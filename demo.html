<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple Linear Regression - interactive demo</title>
<style>
:root{--bg:#f6f8fc;--fg:#14203a;--card:#fff;--acc:#1f6feb;--hot:#d6246e;--grn:#1a9b5b;--dot:#1f3864;--grid:#dde3ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--fg:#e8eefc;--card:#172038;--acc:#4cc9f0;--hot:#f72585;--grn:#80ed99;--dot:#4cc9f0;--grid:#2a3558}}
:root[data-theme="dark"]{--bg:#0f1626;--fg:#e8eefc;--card:#172038;--acc:#4cc9f0;--hot:#f72585;--grn:#80ed99;--dot:#4cc9f0;--grid:#2a3558}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:760px;margin:auto}h1{font-size:1.25rem;margin:.2rem 0 .8rem}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
canvas{width:100%;height:auto;display:block}
label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:.95rem}label span{width:150px}input[type=range]{flex:1}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:.9rem;cursor:pointer;margin:4px 6px 0 0}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--grid)}
</style></head><body><div class="wrap">
<h1>Simple Linear Regression: drag the line, minimise the loss</h1>
<div class="card"><canvas id="c" width="720" height="380"></canvas></div>
<div class="card">
<label><span>intercept b0 = <b id="v0"></b></span><input id="s0" type="range" min="-2" max="6" step="0.01" value="0"></label>
<label><span>slope b1 = <b id="v1"></b></span><input id="s1" type="range" min="-1" max="4" step="0.01" value="0"></label>
<div class="stats"><div>MSE: <b id="mse"></b></div><div>OLS best: <b id="ols"></b></div><div>R&sup2;: <b id="r2"></b></div></div>
<button id="gd">Run gradient descent</button><button id="jump" class="alt">Jump to OLS</button><button id="rst" class="alt">Reset</button>
</div></div>
<script>
// seeded data (mulberry32) so everyone sees the same points
let s=7;function rnd(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function gauss(){return Math.sqrt(-2*Math.log(1-rnd()))*Math.cos(2*Math.PI*rnd())}
const n=40,X=[],Y=[];for(let i=0;i<n;i++){const x=rnd()*5;X.push(x);Y.push(1.5*x+2+0.6*gauss())}
const xb=X.reduce((a,b)=>a+b)/n,yb=Y.reduce((a,b)=>a+b)/n;
let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){sxy+=(X[i]-xb)*(Y[i]-yb);sxx+=(X[i]-xb)**2;syy+=(Y[i]-yb)**2}
const B1=sxy/sxx,B0=yb-B1*xb;
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=cv.width,H=cv.height;
const $=id=>document.getElementById(id);let b0=0,b1=0,timer=null;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const px=x=>40+x/5.2*(W-60),py=y=>H-30-(y+0.5)/11.5*(H-50);
function mse(a,b){let t=0;for(let i=0;i<n;i++)t+=(Y[i]-a-b*X[i])**2;return t/n}
function draw(){g.clearRect(0,0,W,H);g.strokeStyle=css('--grid');g.lineWidth=1;g.fillStyle=css('--fg');g.font='12px sans-serif';
for(let x=0;x<=5;x++){g.beginPath();g.moveTo(px(x),py(-0.5));g.lineTo(px(x),py(11));g.stroke();g.fillText(x,px(x)-3,H-12)}
for(let y=0;y<=10;y+=2){g.beginPath();g.moveTo(px(0),py(y));g.lineTo(px(5.2),py(y));g.stroke();g.fillText(y,12,py(y)+4)}
g.globalAlpha=.55;g.strokeStyle=css('--hot');for(let i=0;i<n;i++){g.beginPath();g.moveTo(px(X[i]),py(Y[i]));g.lineTo(px(X[i]),py(b0+b1*X[i]));g.stroke()}g.globalAlpha=1;
g.setLineDash([6,5]);g.strokeStyle=css('--grn');g.lineWidth=1.5;g.beginPath();g.moveTo(px(0),py(B0));g.lineTo(px(5.2),py(B0+B1*5.2));g.stroke();g.setLineDash([]);
g.strokeStyle=css('--hot');g.lineWidth=3;g.beginPath();g.moveTo(px(0),py(b0));g.lineTo(px(5.2),py(b0+b1*5.2));g.stroke();
g.fillStyle=css('--dot');for(let i=0;i<n;i++){g.beginPath();g.arc(px(X[i]),py(Y[i]),4,0,7);g.fill()}
$('v0').textContent=b0.toFixed(2);$('v1').textContent=b1.toFixed(2);$('s0').value=b0;$('s1').value=b1;
const m=mse(b0,b1);$('mse').textContent=m.toFixed(3);$('ols').textContent=`b0=${B0.toFixed(2)}, b1=${B1.toFixed(2)} (MSE ${mse(B0,B1).toFixed(3)})`;
$('r2').textContent=(1-m*n/syy).toFixed(3)}
function stop(){clearInterval(timer);timer=null;$('gd').textContent='Run gradient descent'}
$('s0').oninput=e=>{stop();b0=+e.target.value;draw()};$('s1').oninput=e=>{stop();b1=+e.target.value;draw()};
$('jump').onclick=()=>{stop();b0=B0;b1=B1;draw()};$('rst').onclick=()=>{stop();b0=b1=0;draw()};
$('gd').onclick=()=>{if(timer)return stop();$('gd').textContent='Stop';timer=setInterval(()=>{
 for(let k=0;k<2;k++){let e0=0,e1=0;for(let i=0;i<n;i++){const r=Y[i]-b0-b1*X[i];e0+=r;e1+=X[i]*r}
 b0+=0.05*2*e0/n;b1+=0.05*2*e1/n}draw()},40)};
matchMedia('(prefers-color-scheme: dark)').onchange=draw;draw();
</script></body></html>
